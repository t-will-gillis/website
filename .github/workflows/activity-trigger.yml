name: Member Activity Trigger

on:
  issues:
    types: [opened, assigned, unassigned, closed]
  issue_comment: 
    types: [created]
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:

  Gather-Information:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' || github.event.action == 'transferred' }}
    steps:
    - uses: actions/checkout@v4

    - name: Identify Action, Actor, and Location
      id: id-action-actor-location
      uses: actions/github-script@v7
      with:

        script: |
          const script = require('./github-actions/utils/activity-trigger.js')
          const return-activity = script({g: github, c: context})