name: Member Activity Trigger

on:
  workflow_call:
  issues:
    types: [opened, assigned, unassigned, closed]
  issue_comment: 
    types: [created]
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  # Adds missing labels to newly-created or transferred issues
  Gather-Information:
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' || github.event.action == 'transferred' }}
    steps:
    - uses: actions/checkout@v4
    # Checks if user is on the 'website-write' team, else halts workflow
    - name: Identify Action, Actor, and Location
      id: id-action-actor-location
      uses: actions/github-script@v7
      with:
        # github-token: ${{ secrets.HACKFORLA_GRAPHQL_TOKEN }}
        script: |
          const act_event = '${{ github.event }}'
          const act_action = '${{ github.event.action }}'
          const username = '${{ github.actor }}'
          const script = require('./github-actions/utils/activity-trigger.js')
          const return-activity = script({g: github, c: context})