name: Member Activity Trigger

on:
  workflow_call:
  issues:
    types: [opened, assigned, unassigned, closed]
  issue_comment: 
    types: [created]
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]

jobs:

  Gather-Event-Information:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Identify Event Name, Action, and Actor
      id: id-name-action-actor
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.HACKFORLA_GRAPHQL_TOKEN }}
        script: |
          const script = require('./github-actions/utils/activity-trigger.js')
          const activity = script({g: github, c: context})
          return activity

    - name: Locate Skills Issue
      id: locate-skills-issue
      uses: actions/github-script@v7
      with:
          script: |
            const results = ${{ steps.id-name-action-actor.outputs.result }}
            const script = require('./github-actions/utils/locate-skills-issue.js')
            script({g: github, c:context}, results)