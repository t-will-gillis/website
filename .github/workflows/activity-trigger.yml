name: Member Activity Trigger

on:
  issues:
    types: [opened, assigned, unassigned, closed]
  issue_comment: 
    types: [created]
  pull_request:
    types: [opened, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:

  Gather-Information:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Identify Action, Actor, and Location
      id: id-action-actor-location
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.HACKFORLA_GRAPHQL_TOKEN }}
        script: |
          const eventName = '${{ github.event_name }}'
          const eventAction = '${{ github.event.action }}'
          const eventActor = '${{ github.actor }}'
          console.log('-------------')
          console.log(eventName)
          console.log('-------------')
          console.log(eventAction)
          console.log('-------------')
          console.log(eventActor)
          console.log('-------------')

          const script = require('./github-actions/utils/activity-trigger.js')
          const activity = script({g: github, c: context}, eventName, eventAction, eventActor)