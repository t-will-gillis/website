name: Issue Activity History

on:
  workflow_dispatch:

jobs:

  Gather-Activity-Event-Information:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Gather Issue Event Details
      id: gather-issue-event-details
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.HACKFORLA_GRAPHQL_TOKEN }}
        script: |
          const script = require('./github-actions/activity-trigger/query-issue-history.js')
          const activity = script({g: github, c: context})
          return activity

