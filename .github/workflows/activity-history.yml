name: Issue Activity History

on:
  workflow_dispatch:

jobs:

  Gather-Activity-Event-Information:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Gather Issue Event Details
      id: gather-issue-event-details
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.HACKFORLA_BOT_PA_TOKEN }}
        script: |
          const script = require('./github-actions/activity-trigger/query-issue-history.js')
          const activity = script({g: github, c: context})
          return activity

    # NOTE: the the URL below matches the **current deployment URL** of the Apps Script
    - name: Send POST request to Google Apps Script
      env:
        activity_history: ${{ steps.gather-issue-event-details.outputs.result }}
      run: |
        curl -X POST "https://script.google.com/macros/s/AKfycbxwfdm4ESq6dH6QuIT0arTbVb40pcMCvrpj_EiJ3GaPW_X3Az_vmkT0hhbLFleAYIU5/exec" \
        -H "Content-Type: application/json" \
        -d "$activity_history"

